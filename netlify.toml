[build]
  # Every deploy, preview or production, must pass lint, typecheck, unit tests, the build, the
  # JavaScript budgets and npm audit first: a failure stops the deploy (GitHub Actions is paused, see SECURITY.md).
  command = "npm run verify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

# The web app manifest with its own media type (Netlify would otherwise send application/octet-stream).
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
