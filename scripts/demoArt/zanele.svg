<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" width="384" height="384">
  <title>Zanele, an illustration</title>
  <rect width="384" height="384" fill="#EFF5F1"/>
  <g transform="translate(192 330) scale(1.15) translate(-192 -330)">
    <!-- Neck, then a dark top with a wide neckline -->
    <path d="M166 230 L166 292 Q192 308 218 292 L218 230 Z" fill="#553220"/>
    <path d="M28 384 C32 320 88 288 146 284 Q192 306 238 284 C296 288 352 320 356 384 Z" fill="#0F2D24"/>
    <!-- Ears with small drop earrings -->
    <ellipse cx="131" cy="180" rx="12" ry="18" fill="#6A4029"/>
    <ellipse cx="253" cy="180" rx="12" ry="18" fill="#6A4029"/>
    <ellipse cx="131" cy="182" rx="5.5" ry="9" fill="#553220"/>
    <ellipse cx="253" cy="182" rx="5.5" ry="9" fill="#553220"/>
    <rect x="128" y="198" width="6" height="14" fill="#CADBD1"/>
    <rect x="250" y="198" width="6" height="14" fill="#CADBD1"/>
    <!-- Head -->
    <path d="M132 172 C132 120 160 98 192 98 C224 98 252 120 252 172 C252 222 226 256 192 256 C158 256 132 222 132 172 Z" fill="#6A4029"/>
    <!-- A green doek, wrapped high, with its knot at the front -->
    <path d="M126 160 C110 128 110 90 132 68 C154 48 230 48 252 68 C274 90 274 128 258 160 C246 140 228 128 192 128 C156 128 138 140 126 160 Z" fill="#0A6B47"/>
    <g fill="none" stroke="#0F2D24" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.5">
      <path d="M132 142 C150 104 206 80 254 78"/>
      <path d="M252 142 C234 104 178 80 130 78"/>
      <path d="M124 112 C150 120 168 128 178 130"/>
      <path d="M260 112 C234 120 216 128 206 130"/>
    </g>
    <g fill="#CADBD1">
      <rect x="144" y="66" width="6" height="6" transform="rotate(45 147 69)"/>
      <rect x="234" y="66" width="6" height="6" transform="rotate(45 237 69)"/>
      <rect x="128" y="96" width="6" height="6" transform="rotate(45 131 99)"/>
      <rect x="250" y="96" width="6" height="6" transform="rotate(45 253 99)"/>
      <rect x="152" y="116" width="6" height="6" transform="rotate(45 155 119)"/>
      <rect x="226" y="116" width="6" height="6" transform="rotate(45 229 119)"/>
      <rect x="166" y="90" width="6" height="6" transform="rotate(45 169 93)"/>
      <rect x="212" y="90" width="6" height="6" transform="rotate(45 215 93)"/>
      <rect x="189" y="60" width="6" height="6" transform="rotate(45 192 63)"/>
    </g>
    <!-- The knot at the front: two folds of cloth either side of a twist -->
    <path d="M190 96 C176 80 154 76 146 90 C152 106 176 106 190 100 Z" fill="#0A6B47" stroke="#0F2D24" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M194 96 C208 80 230 76 238 90 C232 106 208 106 194 100 Z" fill="#0A6B47" stroke="#0F2D24" stroke-width="3.5" stroke-linejoin="round"/>
    <ellipse cx="192" cy="98" rx="9" ry="11" fill="#0A6B47" stroke="#0F2D24" stroke-width="3.5"/>
    <!-- Face -->
    <path d="M154 158 Q167 151 180 155" fill="none" stroke="#1C120D" stroke-width="5" stroke-linecap="round"/>
    <path d="M204 155 Q217 151 230 158" fill="none" stroke="#1C120D" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="168" cy="178" rx="6" ry="7.5" fill="#1C120D"/>
    <ellipse cx="216" cy="178" rx="6" ry="7.5" fill="#1C120D"/>
    <path d="M160 173 L155 169 M224 173 L229 169" stroke="#1C120D" stroke-width="3" stroke-linecap="round"/>
    <circle cx="170" cy="175" r="2" fill="#FFFFFF"/>
    <circle cx="218" cy="175" r="2" fill="#FFFFFF"/>
    <path d="M184 198 C184 208 200 208 200 198" fill="none" stroke="#553220" stroke-width="5" stroke-linecap="round"/>
    <path d="M174 224 Q192 238 210 224" fill="none" stroke="#5A241B" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
